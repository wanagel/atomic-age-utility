Atomic Age Utility:
  ha-card-border-radius: "18px"
  ha-section-border-radius: "22px"
  ha-card-border-style: "solid"
  ha-card-border-width: "2px"

  ha-view-sections-column-gap: "16px"
  ha-view-sections-row-gap: "16px"
  ha-section-grid-column-gap: "8px"
  ha-section-grid-row-gap: "8px"
  ha-color-text-primary: "var(--aau-ink)"
  ha-color-text-secondary: "var(--aau-secondary-ink)"
  ha-color-on-surface-default: "var(--aau-ink)"
  ha-color-surface-default: "var(--aau-surface)"
  ha-color-surface-low: "var(--aau-bg)"
  ha-color-surface-lower: "var(--aau-surface-alt)"
  ha-color-form-background: "var(--aau-surface-alt)"
  ha-color-border-neutral-normal: "var(--aau-divider)"
  ha-color-fill-neutral-quiet-resting: "var(--aau-surface)"
  ha-color-fill-neutral-normal-resting: "var(--aau-surface-alt)"
  ha-color-on-neutral-quiet: "var(--aau-secondary-ink)"
  ha-color-on-neutral-normal: "var(--aau-ink)"
  ha-color-fill-primary-loud-resting: "var(--aau-action)"
  ha-color-on-primary-loud: "var(--aau-on-action)"
  ha-color-on-primary-normal: "var(--aau-action-ink)"
  ha-color-text-link: "var(--aau-action-ink)"
  ha-color-focus: "var(--aau-action-ink)"
  state-active-color: "var(--aau-action-ink)"
  state-inactive-color: "var(--aau-secondary-ink)"
  state-unavailable-color: "var(--aau-secondary-ink)"
  state-light-active-color: "var(--aau-action-ink)"
  state-switch-active-color: "var(--aau-action-ink)"
  state-input_boolean-active-color: "var(--aau-action-ink)"
  state-cover-opening-color: "var(--aau-attention-ink)"
  state-cover-closing-color: "var(--aau-attention-ink)"
  state-alarm_control_panel-pending-color: "var(--aau-attention-ink)"
  state-alarm_control_panel-arming-color: "var(--aau-attention-ink)"
  state-alarm_control_panel-triggered-color: "var(--aau-critical-ink)"
  state-alarm_control_panel-armed_home-color: "var(--aau-secure-ink)"
  state-alarm_control_panel-armed_away-color: "var(--aau-secure-ink)"
  state-lock-locked-color: "var(--aau-secure-ink)"
  state-lock-locking-color: "var(--aau-attention-ink)"
  state-lock-unlocking-color: "var(--aau-attention-ink)"
  state-climate-heat-color: "var(--aau-critical-ink)"
  state-climate-cool-color: "var(--aau-info-ink)"
  error-color: "var(--aau-critical-ink)"
  warning-color: "var(--aau-attention-ink)"
  success-color: "var(--aau-secure-ink)"
  info-color: "var(--aau-info-ink)"

  modes:
    light:
      aau-action: "#365F59"
      aau-on-action: "#F2E9C9"
      aau-action-ink: "#315850"
      aau-attention-ink: "#6B4A06"
      aau-critical-ink: "#873529"
      aau-secure-ink: "#315844"
      aau-info-ink: "#31565E"
      aau-shadow: "rgba(39, 53, 58, 0.18)"
      aau-bg: "#E8DFBD"
      aau-surface: "#F2E9C9"
      aau-surface-alt: "#D5C99D"
      aau-ink: "#27353A"
      aau-ink-muted: "#5D6867"
      aau-secondary-ink: "#495453"
      aau-mint: "#668F82"
      aau-mint-dark: "#365F59"
      aau-coral: "#BD5947"
      aau-gold: "#C4A24D"
      aau-info: "#4F7D86"
      aau-positive: "#5F846E"
      aau-metal: "#A8A292"
      aau-divider: "#6F746C"

      primary-color: "#668F82"
      accent-color: "#BD5947"
